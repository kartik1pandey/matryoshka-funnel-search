name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # flax>=0.11 (needed for nnx.Optimizer.update(model, grads)) requires
        # Python >=3.11 — see pyproject.toml's requires-python comment.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only ML deps + dev tools
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[torch,jax,dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Mypy (type check)
        run: mypy src

      - name: Pytest (unit tests, no GPU / no dataset download)
        run: pytest -m "not gpu and not slow" --cov=matryoshka_search --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
