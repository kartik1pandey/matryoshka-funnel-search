[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matryoshka-search"
version = "0.1.0"
description = "Cross-framework (PyTorch + JAX) reproduction of Matryoshka Representation Learning funnel search on Amazon Berkeley Objects"
readme = "README.md"
license = { text = "MIT" }
# flax>=0.11 (needed for nnx.Optimizer.update(model, grads) — see the `jax`
# extra below) requires Python >=3.11; flax 0.10.x (the last 3.10-compatible
# release) only supports the older update(grads)-only signature, a genuine
# breaking API change, not a version we can straddle.
requires-python = ">=3.11"
authors = [{ name = "Kartik Pandey" }]

dependencies = [
    # Upper-bounded: numpy releases starting around 2.5 ship a bundled .pyi
    # stub using PEP 695 `type X = ...` syntax, which mypy only accepts when
    # `[tool.mypy] python_version >= "3.12"` — since this project's mypy
    # target intentionally tracks the *minimum* supported Python (3.11, see
    # requires-python above) to catch accidental use of newer-only syntax in
    # our own code, an unpinned numpy silently breaks mypy the next time pip
    # resolves a fresh install (this happened once already — see git log).
    "numpy>=1.26,<2.5",
    "pillow>=10.0",
    "pandas>=2.1",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
# Frozen backbone (PyTorch + OpenCLIP). Installed separately from the JAX
# group deliberately — see docs/03_environment_setup.md for why these two
# frameworks are kept in isolated install steps.
torch = [
    "torch>=2.2",
    "open_clip_torch>=2.24",
]
# Trainable Matryoshka head (JAX + Flax NNX + Optax).
jax = [
    # Upper-bounded for the same reason as numpy above: jax 0.11.1 switched
    # jax/numpy/__init__.pyi's `PadValueLike` alias to PEP 695 `type X[T] = ...`
    # syntax, which mypy rejects under this project's python_version = "3.11"
    # target ("Type parameter lists are only supported in Python 3.12 and
    # greater") — broke CI on a fresh install (jax>=0.4.28 was previously
    # unpinned) without any code change on our side. 0.11.0 is the last
    # version confirmed clean.
    "jax>=0.4.28,<0.11.1",
    # >=0.11 for nnx.Optimizer.update(model, grads) — confirmed via
    # inspect.signature() that 0.10.7 only accepts update(grads). Also the
    # version where flax itself starts requiring Python >=3.11 (see
    # requires-python above) — not a coincidence, it's why the floor here
    # and the project's Python floor move together.
    "flax>=0.11.0",
    "optax>=0.2.2",
    # Recent orbax-checkpoint releases (a flax dependency) bundle deeply
    # nested test-fixture paths that exceed Windows' MAX_PATH during pip
    # install, even with Windows Long Paths enabled in some configurations.
    # Pinned to the last version confirmed to install and work cleanly on
    # Windows for this project's actual (non-checkpointing) NNX usage.
    "orbax-checkpoint<0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# Only needed to regenerate the README's result charts
# (scripts/generate_result_charts.py) — kept out of `dev`/CI since it's not
# part of the actual training/eval/demo pipeline.
viz = [
    "matplotlib>=3.8",
]
# Browser UI for the demo (src/matryoshka_search/demo/web.py / app.py) — kept
# out of `dev`/CI since the CLI demo (demo/cli.py) is the tested, required
# path; this is an optional, additional way to run the same pipeline.
# huggingface_hub is only used by scripts/deploy_space.py (publishing the
# same web app to a Hugging Face Space), not by the app itself.
web = [
    "gradio>=4.0",
    "huggingface_hub>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matryoshka_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
# Without this, first-party/third-party grouping for our src-layout package
# is inferred heuristically and disagrees between ruff versions (observed
# between the pinned pre-commit hook and the floating `ruff>=0.4` CI/dev
# install) — pin it explicitly so import formatting is deterministic.
known-first-party = ["matryoshka_search"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Gradio ships its own (partial) type hints, so `ignore_missing_imports`
# above doesn't apply — mypy analyzes the stubs it finds and doesn't resolve
# event-handler methods like `.click()`/`.submit()` on component instances
# (a gradio/mypy ecosystem gap, not a real type error in our usage; verified
# these methods exist and work at runtime). Scoped to just the one module
# that touches gradio's component API.
[[tool.mypy.overrides]]
module = "matryoshka_search.demo.web"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
